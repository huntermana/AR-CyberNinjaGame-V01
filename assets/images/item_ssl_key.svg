<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#1a1600" stroke="#ffb703" stroke-width="4" filter="url(#glow-gold)"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#00f3ff" stroke-dasharray="6 4" stroke-width="2"/>
  <g filter="url(#glow-gold)">
    <circle cx="75" cy="75" r="30" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="75" cy="75" r="14" fill="#ffb703"/>
    <line x1="98" y1="98" x2="145" y2="145" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <line x1="125" y1="125" x2="142" y2="108" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <line x1="138" y1="138" x2="152" y2="124" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <rect x="30" y="152" width="140" height="26" rx="6" fill="#d48b00" filter="url(#glow-gold)"/>
  <text x="100" y="170" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">SSL KEY (CATCH!)</text>
</svg>