<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <linearGradient id="slash-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="480" height="330" rx="16" fill="#070d1e" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)"/>
  <path d="M 10 30 L 30 10 M 490 330 L 470 350" stroke="#00f3ff" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="25" y="22" width="280" height="34" rx="6" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="1.5"/>
  <text x="165" y="45" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="1">✌️ ท่าที่ 1: ชู 2 นิ้วฟัน (SWORD BLADE)</text>

  <!-- Cyber Blade Slash Arc -->
  <path d="M 50 280 Q 210 230 420 75" fill="none" stroke="url(#slash-blade)" stroke-width="20" stroke-linecap="round" filter="url(#glow-cyan)"/>
  <path d="M 80 270 Q 220 220 415 80" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Speed Motion Lines -->
  <path d="M 70 300 Q 190 260 350 145" fill="none" stroke="rgba(0, 243, 255, 0.4)" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M 100 315 Q 220 280 370 170" fill="none" stroke="rgba(0, 243, 255, 0.3)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Cyber Ninja Two-Finger Hand (ดัชนีกระบี่นินจา) -->
  <g transform="translate(170, 150)" filter="url(#glow-cyan)">
    <!-- Palm base -->
    <ellipse cx="40" cy="55" rx="24" ry="28" fill="#0b1a30" stroke="#00f3ff" stroke-width="3"/>
    
    <!-- Folded Thumb holding down ring/pinky -->
    <path d="M 16 52 Q 28 35 42 42" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>

    <!-- Folded Ring & Pinky fingers (Curled into palm) -->
    <ellipse cx="48" cy="46" rx="8" ry="11" fill="#061224" stroke="#00f3ff" stroke-width="2.5"/>
    <ellipse cx="58" cy="54" rx="7" ry="10" fill="#061224" stroke="#00f3ff" stroke-width="2.5"/>

    <!-- TWO EXTENDED FINGERS (Index + Middle straight together) -->
    <!-- Middle Finger -->
    <path d="M 38 32 L 68 -28 L 78 -22 L 48 38 Z" fill="#0f2b4c" stroke="#00f3ff" stroke-width="2.5"/>
    <!-- Index Finger -->
    <path d="M 24 36 L 54 -24 L 64 -18 L 34 42 Z" fill="#0f2b4c" stroke="#00f3ff" stroke-width="2.5"/>

    <!-- Wrist -->
    <rect x="22" y="78" width="36" height="26" rx="4" fill="#071324" stroke="#00f3ff" stroke-width="2"/>
    
    <!-- MediaPipe tracking dots -->
    <circle cx="40" cy="55" r="4" fill="#ffffff"/>
    <circle cx="59" cy="-21" r="5" fill="#ffffff" filter="url(#glow-cyan)"/>
    <circle cx="73" cy="-25" r="5" fill="#00f3ff" filter="url(#glow-cyan)"/>
    
    <!-- Laser energy focus on fingertips -->
    <circle cx="66" cy="-23" r="10" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#glow-cyan)"/>
  </g>

  <!-- Sliced Threat Target (Halved with Sparks) -->
  <g transform="translate(365, 70)" filter="url(#glow-red)">
    <!-- Left Half -->
    <path d="M -15 -35 A 40 40 0 0 0 -15 35 Z" fill="#2d050d" stroke="#ff0055" stroke-width="3"/>
    <!-- Right Half (Pushed away) -->
    <path d="M 5 -30 A 40 40 0 0 1 5 40 Z" fill="#2d050d" stroke="#ff0055" stroke-width="3"/>
    <!-- Cut line sparks -->
    <line x1="-20" y1="40" x2="10" y2="-40" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-5" cy="0" r="6" fill="#ffff00"/>
    <polygon points="-8,-12 -2,-2 8,-10 0,2 6,14 -4,6 -12,12 -6,-2" fill="#ff0055"/>
  </g>

  <!-- Instructions text bottom -->
  <text x="250" y="298" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    ✌️ ชู 2 นิ้ว (ดัชนีกระบี่นินจา) ตวัดฟันตัดผ่าน <tspan fill="#ff0055" font-weight="900">มัลแวร์</tspan> เพื่อผ่าทำลายและเก็บแต้ม!
  </text>
  <text x="250" y="322" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">
    (Two-finger sword stance • Index &amp; Middle extended, Ring &amp; Pinky folded • On PC: Quick mouse swipe)
  </text>
</svg>