<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <filter id="glow-box" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="580" height="340" rx="16" fill="#060914" stroke="#00f3ff" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="540" height="36" rx="8" fill="rgba(0, 243, 255, 0.12)" stroke="#00f3ff" stroke-width="1.5"/>
  <text x="300" y="44" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="18" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="1.5">
    🎯 คู่มือแยกแยะวัตถุ: อะไรต้องฟัน VS อะไรต้องแบมือรับ
  </text>

  <!-- LEFT COLUMN: MUST SLASH (MALWARE) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="260" height="260" rx="12" fill="rgba(255, 0, 85, 0.08)" stroke="#ff0055" stroke-width="2"/>
    <!-- Badge -->
    <rect x="15" y="12" width="230" height="30" rx="6" fill="#ff0055"/>
    <text x="130" y="32" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      ⚔️ ต้องฟันทำลาย! (มัลแวร์)
    </text>

    <!-- Threat Row 1 -->
    <circle cx="35" cy="72" r="18" fill="#2a050d" stroke="#ff0055" stroke-width="2"/>
    <text x="35" y="78" font-size="16" text-anchor="middle">🐴</text>
    <text x="65" y="72" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">ม้าโทรจัน (Trojan)</text>
    <text x="65" y="88" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#ff0055">+100 แต้ม • แฝงตัวขโมยข้อมูล</text>

    <!-- Threat Row 2 -->
    <circle cx="35" cy="118" r="18" fill="#2a050d" stroke="#ff0055" stroke-width="2"/>
    <text x="35" y="124" font-size="16" text-anchor="middle">💀</text>
    <text x="65" y="118" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">แรนซัมแวร์ (Ransomware)</text>
    <text x="65" y="134" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#ff0055">+150 แต้ม • ล็อกไฟล์เรียกค่าไถ่</text>

    <!-- Threat Row 3 -->
    <circle cx="35" cy="164" r="18" fill="#2a050d" stroke="#ff0055" stroke-width="2"/>
    <text x="35" y="170" font-size="16" text-anchor="middle">🎣</text>
    <text x="65" y="164" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">อีเมลฟิชชิ่ง (Phishing)</text>
    <text x="65" y="180" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#ff0055">+120 แต้ม • เมลปลอมหลอกเอารหัส</text>

    <!-- Threat Row 4 -->
    <circle cx="35" cy="210" r="18" fill="#2a050d" stroke="#ff0055" stroke-width="2"/>
    <text x="35" y="216" font-size="16" text-anchor="middle">👁️</text>
    <text x="65" y="210" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">สปายแวร์ / เวิร์ม / DDoS</text>
    <text x="65" y="226" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#ff0055">+130 แต้ม • แอบส่อง/ถล่มเครือข่าย</text>
  </g>

  <!-- RIGHT COLUMN: MUST CATCH (SAFE DATA) -->
  <g transform="translate(310, 70)">
    <rect x="0" y="0" width="260" height="260" rx="12" fill="rgba(255, 183, 3, 0.08)" stroke="#ffb703" stroke-width="2"/>
    <!-- Badge -->
    <rect x="15" y="12" width="230" height="30" rx="6" fill="#ffb703"/>
    <text x="130" y="32" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">
      ✋ ต้องแบมือรับ! (ข้อมูลปลอดภัย)
    </text>

    <!-- Safe Row 1 -->
    <circle cx="35" cy="72" r="18" fill="#211802" stroke="#ffb703" stroke-width="2"/>
    <text x="35" y="78" font-size="16" text-anchor="middle">🔑</text>
    <text x="65" y="72" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">กุญแจเข้ารหัส SSL/TLS</text>
    <text x="65" y="88" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#ffb703">+200 แต้ม (หากเผลอฟัน -100!)</text>

    <!-- Safe Row 2 -->
    <circle cx="35" cy="118" r="18" fill="#021c24" stroke="#00f3ff" stroke-width="2"/>
    <text x="35" y="124" font-size="16" text-anchor="middle">🛡️</text>
    <text x="65" y="118" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">โล่ไฟร์วอลล์ (Firewall)</text>
    <text x="65" y="134" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#00f3ff">+180 แต้ม &amp; เติมเลือดเซิร์ฟเวอร์ +25</text>

    <!-- Safe Row 3 -->
    <circle cx="35" cy="164" r="18" fill="#03162e" stroke="#3b82f6" stroke-width="2"/>
    <text x="35" y="170" font-size="16" text-anchor="middle">💾</text>
    <text x="65" y="164" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ffffff">ไฟล์สำรอง (Data Backup)</text>
    <text x="65" y="180" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#3b82f6">+150 แต้ม &amp; ฟื้นฟูระบบยามวิกฤต</text>

    <!-- Safe Row 4 Notice -->
    <rect x="15" y="200" width="230" height="42" rx="6" fill="rgba(255, 0, 85, 0.15)" stroke="#ff0055" stroke-width="1"/>
    <text x="130" y="218" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" font-weight="900" fill="#ff0055" text-anchor="middle">
      ⚠️ เตือนพิเศษ: สังเกตรูปทรงและแสงสีทอง
    </text>
    <text x="130" y="233" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
      ถ้าเป็นของปลอดภัย ให้กางฝ่ามือรับ ห้ามฟัน!
    </text>
  </g>
</svg>