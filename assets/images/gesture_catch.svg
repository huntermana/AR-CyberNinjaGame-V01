<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="480" height="330" rx="16" fill="#070d1e" stroke="#ffb703" stroke-width="2" filter="url(#glow-gold)"/>

  <!-- Title Badge -->
  <rect x="30" y="24" width="250" height="32" rx="6" fill="rgba(255, 183, 3, 0.15)" stroke="#ffb703" stroke-width="1.5"/>
  <text x="155" y="46" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="900" fill="#ffb703" text-anchor="middle" letter-spacing="1">ท่าที่ 2: แบมือประคองรับ (CATCH)</text>

  <!-- Glowing Containment Field (Hexagonal Rings) -->
  <g transform="translate(250, 160)" filter="url(#glow-gold)">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="rgba(255, 183, 3, 0.05)" stroke="#ffb703" stroke-width="2" stroke-dasharray="10 6"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ffb703" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Open Palm Hand Outline -->
  <g transform="translate(210, 150)" filter="url(#glow-cyan-c)">
    <!-- Palm -->
    <path d="M 15 50 C 10 20, 20 0, 40 0 C 60 0, 70 20, 65 50 Z" fill="#08182b" stroke="#00f3ff" stroke-width="3"/>
    <!-- Extended 5 Fingers Spread -->
    <path d="M 10 25 L -12 10 L -18 22 L 12 38 Z" fill="#0c233c" stroke="#00f3ff" stroke-width="2"/> <!-- Thumb -->
    <path d="M 20 0 L 15 -35 L 28 -35 L 30 0 Z" fill="#0c233c" stroke="#00f3ff" stroke-width="2"/> <!-- Index -->
    <path d="M 33 0 L 37 -45 L 49 -45 L 46 0 Z" fill="#0c233c" stroke="#00f3ff" stroke-width="2"/> <!-- Middle -->
    <path d="M 48 2 L 57 -38 L 68 -36 L 59 5 Z" fill="#0c233c" stroke="#00f3ff" stroke-width="2"/> <!-- Ring -->
    <path d="M 62 10 L 78 -20 L 88 -16 L 70 18 Z" fill="#0c233c" stroke="#00f3ff" stroke-width="2"/> <!-- Pinky -->
    <!-- Wrist -->
    <rect x="22" y="48" width="36" height="30" rx="4" fill="#040c16" stroke="#00f3ff" stroke-width="2"/>
    <!-- Tracking joint dots -->
    <circle cx="40" cy="20" r="5" fill="#ffb703" filter="url(#glow-gold)"/>
    <circle cx="15" cy="-35" r="4" fill="#00f3ff"/>
    <circle cx="37" cy="-45" r="4" fill="#00f3ff"/>
    <circle cx="57" cy="-38" r="4" fill="#00f3ff"/>
    <circle cx="78" cy="-20" r="4" fill="#00f3ff"/>
  </g>

  <!-- Golden Safe SSL Key / Shield absorbed into palm -->
  <g transform="translate(250, 110)" filter="url(#glow-gold)">
    <circle cx="0" cy="0" r="28" fill="#261c02" stroke="#ffb703" stroke-width="3"/>
    <!-- Key graphic -->
    <circle cx="-6" cy="-6" r="10" fill="none" stroke="#ffb703" stroke-width="4"/>
    <line x1="1" y1="1" x2="16" y2="16" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="15" y2="5" stroke="#ffb703" stroke-width="3"/>
    <line x1="14" y1="14" x2="19" y2="9" stroke="#ffb703" stroke-width="3"/>
    <!-- Magnetic pull particles -->
    <path d="M -35 -20 Q -15 10 0 25 M 35 -20 Q 15 10 0 25" fill="none" stroke="#ffb703" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Warning Badge -->
  <rect x="130" y="270" width="240" height="26" rx="6" fill="rgba(255, 0, 85, 0.2)" stroke="#ff0055" stroke-width="1.5"/>
  <text x="250" y="288" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="900" fill="#ff0055" text-anchor="middle">⚠️ ห้ามฟัน! หากเผลอฟันจะเสียคะแนน</text>

  <!-- Instructions text bottom -->
  <text x="250" y="318" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    กางฝ่ามือนิ่งๆ รองรับ <tspan fill="#ffb703" font-weight="900">กุญแจ SSL / โล่ไฟร์วอลล์</tspan> ส่งเข้าเซิร์ฟเวอร์
  </text>
  <text x="250" y="336" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">
    (Open palm to catch • On PC: Hold Spacebar or Click &amp; hold to catch safe packets)
  </text>
</svg>