<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <filter id="glow-setup" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="480" height="330" rx="16" fill="#070d1e" stroke="#00ff66" stroke-width="2" filter="url(#glow-setup)"/>

  <!-- Title Badge -->
  <rect x="30" y="24" width="290" height="32" rx="6" fill="rgba(0, 255, 102, 0.15)" stroke="#00ff66" stroke-width="1.5"/>
  <text x="175" y="46" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="900" fill="#00ff66" text-anchor="middle" letter-spacing="1">การตั้งจุดยืนหน้ากล้อง (CAMERA SETUP)</text>

  <!-- Tablet on Stand -->
  <g transform="translate(60, 110)">
    <!-- Stand -->
    <polygon points="40,160 80,160 70,100 50,100" fill="#1e293b"/>
    <!-- Tablet body -->
    <rect x="25" y="40" width="70" height="100" rx="8" fill="#0f172a" stroke="#00f3ff" stroke-width="2.5"/>
    <circle cx="60" cy="50" r="3" fill="#00ff66" filter="url(#glow-setup)"/> <!-- Front Cam -->
    <rect x="32" y="60" width="56" height="70" rx="4" fill="#020617"/>
    <!-- Table Line -->
    <line x1="0" y1="160" x2="130" y2="160" stroke="#334155" stroke-width="4"/>
    <text x="60" y="180" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="12" font-weight="700" fill="#00f3ff" text-anchor="middle">แท็บเล็ตบนขาตั้ง</text>
  </g>

  <!-- Camera Vision Cone (FOV) -->
  <path d="M 120 160 L 350 70 L 350 250 Z" fill="rgba(0, 243, 255, 0.08)" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Player Standing -->
  <g transform="translate(370, 90)">
    <!-- Head -->
    <circle cx="40" cy="30" r="18" fill="#0f223a" stroke="#00f3ff" stroke-width="2"/>
    <!-- Body -->
    <line x1="40" y1="48" x2="40" y2="110" stroke="#00f3ff" stroke-width="4"/>
    <!-- Raised Hand with Cyber Blade -->
    <path d="M 40 60 L 0 50 L -25 20" fill="none" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-25" cy="20" r="6" fill="#ffffff" filter="url(#glow-setup)"/>
    <!-- Other Hand -->
    <path d="M 40 60 L 60 75 L 75 100" fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 40 110 L 25 170 M 40 110 L 55 170" stroke="#00f3ff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Floor Line -->
    <line x1="-10" y1="170" x2="90" y2="170" stroke="#334155" stroke-width="4"/>
  </g>

  <!-- Distance Indicator Arrow (1.2 - 1.8 Meters) -->
  <g transform="translate(130, 240)">
    <line x1="10" y1="15" x2="220" y2="15" stroke="#ffb703" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="10" cy="15" r="5" fill="#ffb703"/>
    <circle cx="220" cy="15" r="5" fill="#ffb703"/>
    <rect x="55" y="0" width="120" height="28" rx="6" fill="#0d1527" stroke="#ffb703" stroke-width="1.5"/>
    <text x="115" y="20" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="15" font-weight="900" fill="#ffb703" text-anchor="middle">
      1.2 – 1.8 เมตร
    </text>
  </g>

  <!-- Recommendations Checklist -->
  <text x="250" y="295" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    💡 ยืนห่างแท็บเล็ตระดับหน้าอก 1.2 – 1.8 เมตร แสงสว่างสม่ำเสมอ ไม่ย้อนแสง
  </text>
  <text x="250" y="320" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">
    (Stand at chest level in clear lighting • Front camera mirrors your movement automatically)
  </text>
</svg>