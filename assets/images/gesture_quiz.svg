<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <filter id="glow-cyan-q" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-mag-q" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="480" height="330" rx="16" fill="#070d1e" stroke="#00e5ff" stroke-width="2" filter="url(#glow-cyan-q)"/>

  <!-- Title Badge -->
  <rect x="30" y="24" width="260" height="32" rx="6" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="160" y="46" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="16" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="1">ท่าที่ 3: ชูมือตอบคำถาม (FLOATING QUIZ)</text>

  <!-- Choice Pod A (Left - Triggered / Selected) -->
  <g transform="translate(40, 95)" filter="url(#glow-cyan-q)">
    <rect x="0" y="0" width="185" height="110" rx="12" fill="#00e5ff" stroke="#ffffff" stroke-width="3"/>
    <text x="92" y="38" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="22" font-weight="900" fill="#000000" text-anchor="middle">ตัวเลือก A [เลือก]</text>
    <text x="92" y="66" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">ลบอีเมลฟิชชิ่งทิ้งทันที</text>
    <rect x="25" y="78" width="135" height="18" rx="4" fill="#000000"/>
    <text x="92" y="92" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="11" font-weight="900" fill="#00ff66" text-anchor="middle">✓ ถูกต้อง +200 แต้ม</text>
  </g>

  <!-- Choice Pod B (Right) -->
  <g transform="translate(275, 95)">
    <rect x="0" y="0" width="185" height="110" rx="12" fill="rgba(10, 16, 32, 0.9)" stroke="#ff0055" stroke-width="2.5"/>
    <text x="92" y="38" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="20" font-weight="900" fill="#ff0055" text-anchor="middle">ตัวเลือก B</text>
    <text x="92" y="66" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">รีบคลิกลิงก์กรอกข้อมูล</text>
    <text x="92" y="92" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="11" fill="#ff0055" text-anchor="middle">✕ ผิด -100 แต้ม</text>
  </g>

  <!-- Hand pointing to Pod A -->
  <g transform="translate(105, 175)" filter="url(#glow-cyan-q)">
    <!-- Reaching Arm -->
    <path d="M 40 100 L 40 40" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>
    <!-- Pointing Finger Hand -->
    <ellipse cx="40" cy="30" rx="18" ry="22" fill="#091d33" stroke="#00e5ff" stroke-width="2.5"/>
    <!-- Pointing Index Finger Touching Pod A -->
    <path d="M 36 20 L 36 -35 L 46 -35 L 46 20 Z" fill="#0f345c" stroke="#00e5ff" stroke-width="2.5"/>
    <circle cx="41" cy="-35" r="7" fill="#ffffff" filter="url(#glow-cyan-q)"/>
    <!-- Touch Ring Ripples -->
    <circle cx="41" cy="-35" r="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="41" cy="-35" r="24" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Instructions text bottom -->
  <text x="250" y="295" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    ชูมือหรือฟันแตะตัวเลือก <tspan fill="#00e5ff" font-weight="900">A (ซ้าย)</tspan> หรือ <tspan fill="#ff0055" font-weight="900">B (ขวา)</tspan> กลางอากาศเพื่อตอบคำถาม
  </text>
  <text x="250" y="320" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">
    (Point, dwell or slash floating pods in mid-air to select the correct cybersecurity answer)
  </text>
</svg>