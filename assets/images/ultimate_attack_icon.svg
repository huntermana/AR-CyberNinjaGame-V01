<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#00f3ff" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring with Tech Dashes -->
  <circle cx="100" cy="100" r="92" fill="#090e1a" stroke="#00f3ff" stroke-width="3" stroke-dasharray="14, 8" filter="url(#neonGlow)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#ffb703" stroke-width="2" stroke-dasharray="8, 6" />

  <!-- 4 Shuriken Blade Fins -->
  <g transform="translate(100,100)">
    <path d="M 0,-85 L 14,-35 L 0,-18 L -14,-35 Z" fill="url(#bladeGrad)" filter="url(#neonGlow)" />
    <path d="M 85,0 L 35,14 L 18,0 L 35,-14 Z" fill="url(#bladeGrad)" filter="url(#neonGlow)" />
    <path d="M 0,85 L -14,35 L 0,18 L 14,35 Z" fill="url(#bladeGrad)" filter="url(#neonGlow)" />
    <path d="M -85,0 L -35,-14 L -18,0 L -35,14 Z" fill="url(#bladeGrad)" filter="url(#neonGlow)" />

    <!-- Diagonal Secondary Energy Spikes -->
    <path d="M 45,-45 L 22,-12 L 12,-22 Z" fill="#00f3ff" opacity="0.85" />
    <path d="M 45,45 L 12,22 L 22,12 Z" fill="#00f3ff" opacity="0.85" />
    <path d="M -45,45 L -22,12 L -12,22 Z" fill="#00f3ff" opacity="0.85" />
    <path d="M -45,-45 L -12,-22 L -22,-12 Z" fill="#00f3ff" opacity="0.85" />

    <!-- Plasma Energy Core -->
    <circle cx="0" cy="0" r="42" fill="url(#plasmaCore)" />
    <circle cx="0" cy="0" r="22" fill="#ffffff" filter="url(#neonGlow)" opacity="0.9" />

    <!-- Kanji / Symbol for Kill / Overdrive -->
    <text x="0" y="8" font-family="'Rajdhani', 'Kanit', sans-serif" font-size="24" font-weight="900" fill="#090e1a" text-anchor="middle">⚡ULT</text>
  </g>
</svg>
